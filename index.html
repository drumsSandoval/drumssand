<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Portafolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Inter:wght@300;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Sin barras de scroll */
            background-color: #050505;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1; /* El arte va al fondo */
        }

        /* CONTENEDOR FLOTANTE (Ya no es una caja visible) */
        .story-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centrado perfecto */
            text-align: center; /* Alineación de Instagram */
            z-index: 10;
            pointer-events: none; /* Deja pasar clicks al fondo salvo en los textos */
        }

        /* ESTILO "RESALTADO" DE INSTAGRAM */
        .insta-text {
            background-color: #000; /* Fondo negro sólido */
            color: #fff;            /* Letra blanca */
            padding: 0.2em 0.4em;   /* Espacio alrededor de la letra */
            
            /* Tipografía Artística */
            font-family: 'Playfair Display', serif; 
            font-style: italic;
            font-weight: 700;
            font-size: 4rem; /* Tamaño gigante */
            
            /* Truco para que el fondo se pegue al texto en saltos de línea */
            display: inline;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            
            /* Detalle estético */
            line-height: 1.4;
            pointer-events: auto; /* Permitir seleccionar el texto */
        }

        .subtitle {
            font-family: 'Inter', sans-serif; /* Fuente limpia para info secundaria */
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            display: block;
        }

        .pill {
            background: rgba(255, 255, 255, 0.9);
            color: black;
            padding: 5px 15px;
            border-radius: 20px; /* Bordes redondos tipo etiqueta */
            display: inline-block;
            margin: 5px;
            font-weight: bold;
            text-decoration: none; /* Sin subrayado */
            pointer-events: auto; /* Activar clicks */
            transition: transform 0.2s;
        }

        .pill:hover {
            transform: scale(1.1); /* Efecto pop al pasar el mouse */
            background: #fff;
        }

        /* AJUSTE PARA MÓVIL */
        @media (max-width: 600px) {
            .insta-text {
                font-size: 2.5rem; /* Más pequeño en celular */
            }
        }
    </style>
</head>
<body>

    <div class="story-container">
        <div>
            <span class="insta-text">Drumssand</span>
        </div>
        
        <br>

        <div class="subtitle">
            <a href="#" class="pill">GITHUB</a>
            <a href="#" class="pill">EMAIL</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    
    <!-- ART DIRECTOR SYSTEM -->
    <script>
        const sketches = [
            'sketches/draw_flow.js',
            'sketches/adhd_wave.js',
            'sketches/hard_noise.js',
            'sketches/paint.js',
        ];

        // Randomly select one sketch
        const randomSketch = sketches[Math.floor(Math.random() * sketches.length)];

        // Create script tag and append to body
        const script = document.createElement('script');
        script.src = randomSketch;
        document.body.appendChild(script);

        console.log(`Loaded Art Style: ${randomSketch}`);
    </script>
</body>
</html>
