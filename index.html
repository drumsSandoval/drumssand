<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oscar Sandoval | Creative Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            -webkit-user-select: none; 
            -moz-user-select: none;    
            -ms-user-select: none;     
            user-select: none;             
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; 
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            touch-action: none;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .layout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center; 
            justify-content: flex-start; 
            pointer-events: none; 
        }
        .profile-card {
            margin-left: 10vw; 
            pointer-events: auto; 
            max-width: 300px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }
        .profile-img {
            width: 50px; 
            height: 50px;
            border-radius: 50%; 
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1); 
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .profile-img:hover {
            transform: scale(1.1) rotate(5deg);
        }
        .tag {
            display: block;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8); 
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
            font-weight: 300;
            background-color: rgba(0,0,0,1);
            width: fit-content;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem; 
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            padding:  5px;
            margin: 0 0 0.5rem 0;
            background-color: rgba(0,0,0,1);
            text-shadow: 0 20px 30px rgba(0,0,0,0.5); 
        }
        .role {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
            margin-bottom: 2rem;
            display: inline-block;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 5px;
            padding: 5px;
            background-color: rgba(0,0,0,1);
            padding: 5px;
        }
        .socials {
            display: flex;
            gap: 20px; 
            background-color: rgba(0,0,0,0.8);
            padding: 5px 10px; 
            width: fit-content;
            border-radius: 10px;

        }
        .social-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.4rem;
            transition: all 0.3s ease;
        }
        .social-link:hover {
            color: #fff;
            transform: translateY(-3px); 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            .profile-card {
                margin-left: 8vw; 
                margin-bottom: 10vh; 
            }
            .name {
                font-size: 2rem; 
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="profile-card">
            
            <img id="profile-pic" src="" alt="Oscar Sandoval" class="profile-img">

            <span class="tag">@drumssand</span>
            <h1 class="name">Oscar Sandoval</h1>
            <span class="role">Creative Developer</span>

            <div class="socials">
                <a href="https://mx.linkedin.com/in/drumssand" class="social-link" title="LinkedIn"><i class="ri-linkedin-fill"></i></a>
                <a href="https://github.com/drumsSandoval" class="social-link" title="GitHub"><i class="ri-github-fill"></i></a>
                <a href="https://www.instagram.com/drumssand/" class="social-link" title="Instagram"><i class="ri-instagram-line"></i></a>
                <a href="mailto:drumssand@gmail.com" class="social-link" title="Email"><i class="ri-mail-send-line"></i></a>
            </div>

        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script>
        const profileImages = [
            'assets/profile.jpeg',
            'assets/profile2.jpg'
        ];
        const randomImage = profileImages[Math.floor(Math.random() * profileImages.length)];
        const imgElement = document.getElementById('profile-pic');
        imgElement.onerror = function() {
            this.style.display = 'none'; 
        };
        imgElement.src = randomImage;
        const sketches = [
            'sketches/draw_flow.js',
            'sketches/adhd_wave.js',
            'sketches/hard_noise.js',
            'sketches/paint.js',
        ];
        const randomSketch = sketches[Math.floor(Math.random() * sketches.length)];
        const script = document.createElement('script');
        script.src = randomSketch;
        document.body.appendChild(script);
    </script>
</body>
</html>
